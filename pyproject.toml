[project]
name = "explore-and-extract"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "distro==1.9.0",
  "jiter==0.13.0",
  "openai>=2.36.0",
  "openai-agents>=0.17.0",
  "pydantic>=2.13.4",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.3",
  "sniffio==1.3.1",
]

[project.scripts]
explore-and-extract = "agent.main:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.12",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
no-binary-package = ["distro", "sniffio"]
